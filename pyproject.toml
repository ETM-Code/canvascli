[project]
name = "canvas-tools"
version = "1.0.0"
description = "Canvas LMS CLI tools - canvascli and canvas-course-puller"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "ETM-Code" }
]

[project.urls]
Homepage = "https://github.com/ETM-Code/canvascli"
Repository = "https://github.com/ETM-Code/canvascli"
Issues = "https://github.com/ETM-Code/canvascli/issues"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
canvas-api = { workspace = true }
canvas-course-puller = { workspace = true }
canvascli = { workspace = true }
