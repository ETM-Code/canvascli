[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "canvas-course-puller"
version = "0.1.0"
description = "Bulk download Canvas LMS courses and convert to PDF"
readme = "../../README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "ETM-Code" }
]
dependencies = [
    "canvas-api",
    "questionary>=2.0.0",
    "weasyprint>=60.0",
    "pypdf>=3.17.0",
    "Pillow>=10.0.0",
    "markdown>=3.5.0",
    "beautifulsoup4>=4.12.0",
    "python-docx>=1.0.0",
    "openpyxl>=3.1.0",
    "python-pptx>=0.6.0",
    "rich>=13.0.0",
]

[project.scripts]
canvas-course-puller = "canvas_course_puller.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["canvas_course_puller"]
