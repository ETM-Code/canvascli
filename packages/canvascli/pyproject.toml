[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "canvascli"
version = "1.0.0"
description = "Comprehensive CLI for Canvas LMS"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "ETM-Code" }
]
dependencies = [
    "canvas-api",
    "canvas-course-puller",
    "click>=8.1.0",
    "rich>=13.0.0",
    "rich-click>=1.7.0",
    "html2text>=2024.2.26",
]

[project.scripts]
canvascli = "canvascli.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["canvascli"]
